# Monthly refresh: download the latest six months of Job Bank postings from open.canada.ca, rerun the matching,
# planner and new-product analysis, and publish the interactive page to GitHub Pages. Runs on the 10th of each
# month (Job Bank publishes the previous month early in the month), or by hand (Actions tab > monthly refresh >
# Run workflow). If any step fails, nothing is published and GitHub emails the owner.
name: monthly refresh

on:
  schedule:
    - cron: "0 11 10 * *"   # 11:00 UTC on the 10th
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore downloads and caches from the last run
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/cache
          key: atp-data-${{ github.run_id }}
          restore-keys: atp-data-

      # Road and postal-area geometry come from data/derived (the StatCan site refuses automated downloads).
      # The dashboard images use Windows fonts this Linux runner lacks, so they are redrawn locally (--report).
      - name: Fetch the latest postings, run the analysis, build the page
        run: python run_all.py --fetch --site --no-report

      - name: Keep the downloads for next time
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/cache
          key: atp-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
